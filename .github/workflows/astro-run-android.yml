name: Astro Run APK

on:
  push:
    paths:
      - 'astro-run/**'
      - 'android/**'
      - '.github/workflows/astro-run-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk AstroRun.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AstroRun-APK
          path: AstroRun.apk
          if-no-files-found: error
